# CareSaathi local and single-host deployment.
#   docker compose up -d db minio            -> database and object storage only (usable today)
#   docker compose --profile app up -d --build -> adds api, web and caddy (see docs/19-deployment.md)
#
# The database container loads db/schema.sql, the seed list and the roles on first start only.
# Change the passwords in .env (copy .env.example). Never commit .env.

name: caresaathi

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-caresaathi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/seed_drug_families.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - ./db/roles_and_grants.sql:/docker-entrypoint-initdb.d/30-roles.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-caresaathi}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # ---- the app (profile "app"): api + web + caddy, on one machine ----------------------------------------------------
  # Uses .env.production (copy .env.production.example). Files are kept on the "storage" volume (STORAGE_BACKEND=local).
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/srv/.storage
    expose:
      - "8000"

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    profiles: ["app"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    depends_on:
      - web

volumes:
  pgdata:
  miniodata:
  caddydata:
  storage:
