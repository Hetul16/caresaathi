# One free web service: the FastAPI backend (docs/19-deployment.md, way D). The website is on Vercel and the database on Neon, because
# Render's own free Postgres expires 30 days after it is created. Create the Blueprint, then paste the values marked `sync: false`.
#
# The image already runs `alembic upgrade head` before uvicorn, so a deploy migrates. It does NOT create the baseline schema or the
# database roles: do those once by hand against Neon (docs/19, way D, step 2) before the first deploy, or the first migration fails.
services:
  - type: web
    name: caresaathi-api
    runtime: docker
    plan: free
    region: singapore              # put the Neon project in the same region; a cross-region query doubles every page load
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .               # the image copies data/synthetic, which lives above backend/
    healthCheckPath: /healthz      # left open by the site gate on purpose, so Render can see the container is alive
    autoDeployTrigger: commit
    envVars:
      # --- Neon. One connection string per role, each with ?sslmode=require ---
      - key: DATABASE_URL_ADMIN
        sync: false
      - key: DATABASE_URL_APP
        sync: false
      - key: DATABASE_URL_AUTH
        sync: false
      - key: DATABASE_URL_WORKER
        sync: false
      # --- Files live on the container's own disk (D-73). Every S3-compatible provider wanted a card on file, and the
      #     hackathon demo must cost nothing, so uploads are written locally and are lost whenever the container restarts.
      #     Each visitor presses "Load the demo family", which writes that visitor's documents fresh, so a restart costs
      #     them a click and nothing else. Keep the service warm during judging and it does not restart at all.
      #     For anything beyond the demo, set STORAGE_BACKEND=s3 and fill S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY. ---
      - key: STORAGE_BACKEND
        value: local
      # --- The live model. The spend ledger is a table now (D-68), so SPEND_LIMIT_USD survives a restart and really is the ceiling ---
      - key: MODEL_MODE
        value: live
      - key: META_API_KEY
        sync: false
      - key: SPEND_LIMIT_USD
        value: "5.00"
      - key: ALLOW_CONTRIBUTOR_MODELS
        value: "true"
      - key: REFERENCE_LIST_REQUIRE_REVIEW
        value: "true"
      - key: ALLOW_DEMO_SEED
        value: "true"
      # --- Secrets. Generated here so they never exist in a file; the app refuses to start on https without them ---
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_PEPPER
        generateValue: true
      # --- Private until submission day (D-69). The SAME value goes in Vercel; clear it in BOTH places to go public.
      #     Leave it blank for a demo judges must be able to open. ---
      - key: SITE_GATE_TOKEN
        sync: false
      # --- The address people open: the Vercel domain, not this service's. Emergency card links are built from it ---
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
